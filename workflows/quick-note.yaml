name: "快速便签"
description: "在桌面创建带时间戳的便签文本文件并用记事本打开"
variables:
  title: "便签"
steps:
  - name: 生成时间戳
    action: python
    command: "datetime.datetime.now().strftime('%Y%m%d_%H%M%S')"
    capture: ts
  - name: 创建便签文件
    action: file
    command: "$USERPROFILE\\Desktop\\$title-$ts.txt"
    args:
      mode: w
      content: "$title\n创建于: $ts\n---\n"
  - name: 用记事本打开
    action: shell
    command: 'notepad "$USERPROFILE\\Desktop\\$title-$ts.txt"'
